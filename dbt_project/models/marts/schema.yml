version: 2

models:
  - name: fct_daily_saas_operations
    description: "Incremental daily mart joining SaaS support ticket metrics with financial billing index rates."
    columns:
      - name: activity_date
        data_tests:
          - unique
          - not_null
      - name: total_tickets_updated
        data_tests:
          - not_null

  - name: dim_customers
    description: >
      Customer account dimension combining SaaS subscription tier, MRR, contract renewal date,
      SCD Type 2 snapshot history, and aggregated support ticket escalation metrics.
    columns:
      - name: account_id
        description: Unique SaaS customer account identifier from stg_saas_accounts.
        data_tests:
          - not_null
          - unique
      - name: plan_tier
        description: Standardized subscription tier (Enterprise, Growth, Starter).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Enterprise
                  - Growth
                  - Starter
      - name: mrr_usd
        description: Monthly recurring revenue in USD.
        data_tests:
          - not_null

  - name: mart_ticket_escalation_risk
    description: >
      Ticket-level operational and escalation risk mart combining cleaned support ticket
      attributes, SaaS customer account context, engagement volume tiers, ticket aging,
      and SCD Type 2 snapshot history.
    columns:
      - name: ticket_id
        description: Unique ticket identifier from stg_support_tickets.
        data_tests:
          - not_null
          - unique
      - name: account_id
        description: Linked SaaS customer account identifier mapped to the support ticket.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: account_id
              config:
                where: "account_id is not null"
      - name: escalation_risk_tier
        description: Triage tier separating high-risk open tickets, watchlisted open tickets, and closed tickets.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - High Escalation Risk
                  - Watchlist - Open
                  - Resolved / Closed

  - name: mart_daily_operations_market_trends
    description: >
      Daily executive mart built on fct_daily_saas_operations adding open ticket share,
      interactions per ticket, day-over-day billing index changes, and load status.
    columns:
      - name: activity_date
        description: Calendar date of operational and market index activity.
        data_tests:
          - not_null
          - unique
      - name: daily_operational_load_status
        description: Daily workload classification for support and finance monitoring.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Elevated Operational Load
                  - Normal Operational Load